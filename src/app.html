<title>Band Ladder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F4F6F5; --surface:#FFFFFF; --surface-2:#EDF1F0; --sunk:#E4EAE8;
  --ink:#141A1C; --ink-2:#3D4B4E; --muted:#667578; --line:#D6DEDC; --line-2:#C2CDCA;
  --accent:#0C6B7A; --accent-ink:#FFFFFF; --accent-soft:#DCEEF1; --accent-line:#8FC5CE;
  --ochre:#8A5A11; --ochre-soft:#F6EEDF; --ochre-line:#DFC58C;
  --good:#2C7A4B; --good-soft:#DFEFE4;
  --warn:#96631B; --warn-soft:#F6EBDA;
  --bad:#A93A36; --bad-soft:#F7E2E0;
  --shadow:0 1px 2px rgba(20,26,28,.06),0 6px 20px -12px rgba(20,26,28,.28);
  --radius:10px; --radius-sm:6px;
  --rail:76px;
  --fd:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --fb:'Literata',Georgia,'Times New Roman',serif;
  --fm:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1416; --surface:#151D20; --surface-2:#1B2528; --sunk:#111A1C;
    --ink:#E7EEEC; --ink-2:#C0CDCB; --muted:#8B9C9F; --line:#253134; --line-2:#334346;
    --accent:#4CC5DB; --accent-ink:#06282F; --accent-soft:#12333A; --accent-line:#2A6675;
    --ochre:#E0A94B; --ochre-soft:#2E2413; --ochre-line:#6B5321;
    --good:#5FC98A; --good-soft:#12301F;
    --warn:#D7A257; --warn-soft:#2D2314;
    --bad:#E88880; --bad-soft:#331A18;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1416; --surface:#151D20; --surface-2:#1B2528; --sunk:#111A1C;
  --ink:#E7EEEC; --ink-2:#C0CDCB; --muted:#8B9C9F; --line:#253134; --line-2:#334346;
  --accent:#4CC5DB; --accent-ink:#06282F; --accent-soft:#12333A; --accent-line:#2A6675;
  --ochre:#E0A94B; --ochre-soft:#2E2413; --ochre-line:#6B5321;
  --good:#5FC98A; --good-soft:#12301F;
  --warn:#D7A257; --warn-soft:#2D2314;
  --bad:#E88880; --bad-soft:#331A18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--fd);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.011em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}

/* ── shell ────────────────────────────────────────────── */
.shell{display:flex;min-height:100%;align-items:flex-start}
.rail{position:sticky;top:env(safe-area-inset-top,0px);flex:0 0 var(--rail);width:var(--rail);
  height:100dvh;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:stretch;padding-block:14px;gap:2px;z-index:20}
.rail-mark{font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--muted);
  text-align:center;padding-bottom:12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.rail-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 4px;
  border-left:2px solid transparent;color:var(--muted);transition:color .15s,background .15s}
.rail-btn .n{font-family:var(--fm);font-size:14px;font-weight:600;letter-spacing:.02em}
.rail-btn .t{font-size:8.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;line-height:1.25;text-align:center}
.rail-btn:hover{color:var(--ink-2);background:var(--surface-2)}
.rail-btn[aria-current="true"]{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft)}
.rail-badge{position:absolute;transform:translate(16px,-10px);font-family:var(--fm);font-size:9px;font-weight:600;
  background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:1px 5px;line-height:1.5}
.rail-sp{flex:1}
.rail-theme{display:flex;justify-content:center;padding-top:10px;border-top:1px solid var(--line)}
.rail-theme button{width:30px;height:30px;border-radius:var(--radius-sm);color:var(--muted);display:grid;place-items:center}
.rail-theme button:hover{background:var(--surface-2);color:var(--ink)}

.main{flex:1;min-width:0;padding-inline:clamp(16px,3.4vw,40px);padding-block:0 96px}
.wrap{max-width:860px;margin-inline:auto}

/* ── header ───────────────────────────────────────────── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-inline:calc(clamp(16px,3.4vw,40px) * -1);
  padding-inline:clamp(16px,3.4vw,40px);padding-block:13px;margin-bottom:30px}
.top-in{max-width:860px;margin-inline:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-size:15px;font-weight:700;letter-spacing:-.02em;margin-right:auto}
.brand span{color:var(--accent)}
.counters{display:flex;gap:7px;flex-wrap:wrap}
.ctr{font-family:var(--fm);font-size:10.5px;font-weight:500;border:1px solid var(--line-2);border-radius:99px;
  padding:3px 10px;color:var(--ink-2);background:var(--surface);white-space:nowrap}
.ctr b{font-weight:600;color:var(--ink)}
.ctr.is-accent{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}
.ctr.is-ochre{border-color:var(--ochre-line);background:var(--ochre-soft);color:var(--ochre)}
.ctr.is-learned{border-color:color-mix(in srgb,var(--good) 50%,transparent);background:var(--good-soft);color:var(--good)}

/* ── section furniture ────────────────────────────────── */
.sec{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sec{animation:none}*{transition-duration:.01ms!important}}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.sec-num{font-family:var(--fm);font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.06em}
.sec-head h2{font-size:clamp(20px,3.6vw,26px);letter-spacing:-.025em}
.sec-sub{color:var(--muted);font-size:13.5px;max-width:62ch;margin-bottom:22px;line-height:1.55}

.tabs{display:flex;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--radius);
  padding:3px;margin-bottom:20px;width:fit-content;max-width:100%}
.tabs button{padding:6px 16px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(16px,2.6vw,24px)}
.stack{display:flex;flex-direction:column;gap:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 18px;border-radius:var(--radius-sm);
  font-size:13px;font-weight:600;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);transition:.15s}
.btn:hover{border-color:var(--ink-2)}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-p:hover{filter:brightness(1.08);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{padding:6px 12px;font-size:12px}

.note{font-size:12.5px;color:var(--muted);line-height:1.55}
.empty{text-align:center;padding:44px 18px;color:var(--muted)}
.empty h3{font-size:16px;color:var(--ink);margin-bottom:7px}
.empty p{font-size:13px;max-width:44ch;margin-inline:auto;line-height:1.6}

/* ── flip card ────────────────────────────────────────── */
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;min-height:24px}
.tag{font-family:var(--fm);font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  padding:2.5px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted);background:var(--surface-2)}
.tag.k-word{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.tag.k-phrase{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent);background:var(--good-soft)}
.tag.k-grammar{color:var(--ochre);border-color:var(--ochre-line);background:var(--ochre-soft)}
.tag.due{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:var(--bad-soft)}
.tag.learned{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent);background:var(--good-soft)}
.tag.easy-tally{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);font-variant-numeric:tabular-nums}
.prog{margin-left:auto;font-family:var(--fm);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-face{padding:clamp(20px,3.4vw,34px);min-height:210px;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;gap:11px;cursor:pointer}
.card-face:hover .flip-hint{color:var(--accent)}
.item{font-family:var(--fd);font-size:clamp(26px,5.6vw,38px);font-weight:600;letter-spacing:-.03em;line-height:1.15}
.item.long{font-size:clamp(20px,4.2vw,28px)}
.pos{font-size:12.5px;color:var(--muted);font-style:italic;font-family:var(--fb)}
.ipa{font-family:var(--fm);font-size:13px;color:var(--ink-2);letter-spacing:-.01em}
.flip-hint{font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:5px;transition:color .15s}

.audio{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);
  border-radius:99px;padding:6px 13px;font-size:12px;font-weight:600;color:var(--ink-2);transition:.15s}
.audio:hover{border-color:var(--accent);color:var(--accent)}
.audio.playing{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.audio.failed{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.audio svg{width:13px;height:13px;flex:0 0 13px}
.audio-err{font-size:11.5px;color:var(--bad);margin-top:6px;line-height:1.5;max-width:40ch}

.back{border-top:1px solid var(--line);padding:clamp(18px,3vw,26px);display:flex;flex-direction:column;gap:0}
.fld{padding-block:13px;border-bottom:1px solid var(--line)}
.fld:first-child{padding-top:0}
.fld:last-child{border-bottom:0;padding-bottom:0}
.fld-l{font-family:var(--fm);font-size:9.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fld-b{font-family:var(--fb);font-size:14.5px;line-height:1.62;color:var(--ink)}
.fld-b.mono{font-family:var(--fm);font-size:12.5px;line-height:1.75;white-space:pre-line;color:var(--ink-2)}
.ex{font-family:var(--fb);font-size:14.5px;line-height:1.62;font-style:italic;color:var(--ink)}
.ex-row{display:flex;gap:11px;align-items:flex-start}
.ex-row .audio{flex:0 0 auto;margin-top:1px}

.fld.zh .fld-l{color:var(--ochre)}
.fld.zh .fld-b{font-family:var(--fb);font-size:15px;color:var(--ink)}
.fld.why{background:var(--ochre-soft);border:1px solid var(--ochre-line);border-radius:var(--radius-sm);
  padding:14px 16px;margin-top:13px}
.fld.why .fld-l{color:var(--ochre);margin-bottom:7px}
.fld.why .fld-b{font-size:13.5px;line-height:1.68;color:var(--ink)}
.fld.err .fld-b{color:var(--bad)}

.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.grade{padding:11px 6px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--surface);
  display:flex;flex-direction:column;gap:3px;align-items:center;transition:.14s}
.grade .g{font-size:12.5px;font-weight:600}
.grade .i{font-family:var(--fm);font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.grade:hover{transform:translateY(-1px)}
.grade.g0:hover{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.grade.g1:hover{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.grade.g2:hover{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.grade.g3:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.grade:hover .i{color:inherit}
.grade.retires{border-color:color-mix(in srgb,var(--good) 55%,transparent);background:var(--good-soft)}
.grade.retires .i{color:var(--good);font-weight:600}
.grade.retires:hover{border-color:var(--good);background:var(--good-soft);color:var(--good)}

.recap-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.nav-btn{width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--surface);
  display:grid;place-items:center;color:var(--ink-2);transition:.15s}
.nav-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
select{font:inherit;font-size:12.5px;padding:7px 11px;border-radius:var(--radius-sm);border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink);cursor:pointer;max-width:100%}

/* ── recall ───────────────────────────────────────────── */
.q-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.q-type{font-family:var(--fm);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:99px;padding:2.5px 9px}
.q-stem{font-family:var(--fb);font-size:17px;line-height:1.55;margin-bottom:18px}
.q-stem .blank{display:inline-block;min-width:88px;border-bottom:2px solid var(--accent);vertical-align:baseline}
.q-stem em{color:var(--ochre);font-style:normal;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px 15px;border-radius:var(--radius-sm);border:1px solid var(--line-2);
  background:var(--surface);font-size:14px;transition:.14s;display:flex;gap:11px;align-items:flex-start;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--fm);font-size:11px;font-weight:600;color:var(--muted);flex:0 0 auto;margin-top:2px}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:600}
.opt.right .k{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt.wrong .k{color:var(--bad)}
input[type=text],textarea{font:inherit;width:100%;padding:11px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
input[type=text]{font-family:var(--fm);font-size:15px}
textarea{font-family:var(--fb);font-size:14.5px;line-height:1.65;resize:vertical;min-height:90px}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.verdict{margin-top:16px;padding:14px 16px;border-radius:var(--radius-sm);border:1px solid;font-size:13.5px;line-height:1.6}
.verdict.ok{border-color:color-mix(in srgb,var(--good) 45%,transparent);background:var(--good-soft)}
.verdict.no{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:var(--bad-soft)}
.verdict-h{font-weight:700;font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.verdict.ok .verdict-h{color:var(--good)}
.verdict.no .verdict-h{color:var(--bad)}
.verdict .why-box{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-family:var(--fb);color:var(--ink)}
.verdict .why-l{font-family:var(--fm);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ochre);margin-bottom:5px}

.bar{height:4px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.score-big{font-family:var(--fm);font-size:42px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* ── reading ──────────────────────────────────────────── */
.clock{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:12;display:flex;align-items:center;gap:11px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 15px;margin-bottom:20px;
  box-shadow:var(--shadow);flex-wrap:wrap}
.clock-t{font-family:var(--fm);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock-t.over{color:var(--bad)}
.clock-l{font-family:var(--fm);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.clock.idle .clock-t{color:var(--muted)}
.passage{font-family:var(--fb);font-size:15.5px;line-height:1.72;max-width:66ch}
.passage p{margin-bottom:15px;text-align:left}
.passage .pid{font-family:var(--fm);font-size:10px;font-weight:600;color:var(--accent);letter-spacing:.1em;
  margin-right:9px;vertical-align:2px}
.gap{display:inline;background:var(--accent-soft);border-bottom:2px solid var(--accent);border-radius:3px;
  padding:1px 7px;font-family:var(--fm);font-size:12px;font-weight:600;color:var(--accent)}
.gap.filled{font-family:var(--fb);font-size:15.5px;font-weight:400;font-style:italic;background:var(--ochre-soft);
  border-bottom-color:var(--ochre);color:var(--ink)}
.rq{border-top:1px solid var(--line);padding-top:20px;margin-top:20px}
.rq:first-of-type{border-top:0;margin-top:0}
.rq-n{font-family:var(--fm);font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.06em}
.rq-t{font-family:var(--fm);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.exp{margin-top:13px;padding:13px 15px;border-radius:var(--radius-sm);border:1px solid var(--line);
  background:var(--surface-2);font-family:var(--fb);font-size:13.5px;line-height:1.65}
.exp-h{font-family:var(--fm);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.exp.ok .exp-h{color:var(--good)}
.exp.no .exp-h{color:var(--bad)}
.gap-list{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.gap-opt{text-align:left;padding:10px 13px;border-radius:var(--radius-sm);border:1px solid var(--line-2);
  background:var(--surface);font-family:var(--fb);font-size:13.5px;line-height:1.55;display:flex;gap:10px;transition:.14s}
.gap-opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.gap-opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.gap-opt.right{border-color:var(--good);background:var(--good-soft)}
.gap-opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.gap-opt .k{font-family:var(--fm);font-size:11px;font-weight:600;color:var(--muted);flex:0 0 auto;margin-top:1px}
.gap-opt.used{opacity:.45}

/* ── writing ──────────────────────────────────────────── */
.drill{padding-block:18px;border-bottom:1px solid var(--line)}
.drill:first-child{padding-top:0}
.drill:last-child{border-bottom:0;padding-bottom:0}
.drill-p{font-family:var(--fb);font-size:14.5px;line-height:1.6;padding:12px 15px;background:var(--sunk);
  border-radius:var(--radius-sm);border-left:2px solid var(--accent);margin-bottom:11px}
.drill-i{font-size:12.5px;color:var(--muted);margin-bottom:9px}
.model{margin-top:11px;padding:13px 15px;border-radius:var(--radius-sm);border:1px solid var(--accent-line);
  background:var(--accent-soft)}
.model-l{font-family:var(--fm);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.model-b{font-family:var(--fb);font-size:14.5px;line-height:1.6}
.model-n{margin-top:9px;padding-top:9px;border-top:1px solid var(--accent-line);font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.wc{font-family:var(--fm);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:9px;align-items:center}
.wc b{color:var(--ink);font-weight:600}
.wc.hit b{color:var(--good)}
.check{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px}
.check li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.55}
.check li:last-child{border-bottom:0}
.check input{margin-top:3px;flex:0 0 auto;accent-color:var(--accent);width:14px;height:14px}
.check label{cursor:pointer}
.saved{font-family:var(--fm);font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.saved.on{color:var(--good)}

/* ── speaking ─────────────────────────────────────────── */
.sp-part{margin-bottom:26px}
.sp-h{display:flex;align-items:baseline;gap:11px;margin-bottom:5px;flex-wrap:wrap}
.sp-h h3{font-size:16px}
.qlist{list-style:none;padding:0;margin:11px 0 0;display:flex;flex-direction:column;gap:2px}
.qlist li{font-family:var(--fb);font-size:14.5px;line-height:1.6;padding:10px 0;border-bottom:1px solid var(--line);
  display:flex;gap:12px}
.qlist li:last-child{border-bottom:0}
.qlist .qn{font-family:var(--fm);font-size:11px;color:var(--muted);flex:0 0 auto;margin-top:3px}
.cue{border:1px solid var(--line-2);border-radius:var(--radius);padding:18px 20px;background:var(--sunk)}
.cue-t{font-family:var(--fb);font-size:17px;font-weight:600;margin-bottom:11px;line-height:1.4}
.cue ul{margin:0;padding-left:19px;font-family:var(--fb);font-size:14.5px;line-height:1.75;color:var(--ink-2)}
.timer-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:15px 18px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface);margin-top:14px}
.timer-t{font-family:var(--fm);font-size:27px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:82px}
.timer-t.over{color:var(--bad)}
.timer-t.prep{color:var(--ochre)}
.timer-l{font-family:var(--fm);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ── reference ────────────────────────────────────────── */
.phase{display:flex;gap:16px;padding-block:17px;border-bottom:1px solid var(--line)}
.phase:last-child{border-bottom:0}
.phase-n{font-family:var(--fm);font-size:11px;font-weight:600;color:var(--accent);flex:0 0 58px;letter-spacing:.04em;padding-top:2px}
.phase-b h4{font-size:14.5px;margin-bottom:5px}
.phase-b p{font-size:13px;color:var(--ink-2);line-height:1.6;max-width:58ch}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:430px;font-size:13px}
th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line)}
th{font-family:var(--fm);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td{font-variant-numeric:tabular-nums}
td.mono{font-family:var(--fm);color:var(--ink-2)}
tbody tr:last-child td{border-bottom:0}

.banner{display:flex;gap:11px;align-items:flex-start;padding:12px 15px;border-radius:var(--radius-sm);
  border:1px solid var(--ochre-line);background:var(--ochre-soft);font-size:12.5px;line-height:1.6;margin-bottom:18px}
.banner b{color:var(--ochre)}

/* ── narrow ───────────────────────────────────────────── */
@media (max-width:760px){
  .shell{flex-direction:column}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);width:100%;flex:0 0 auto;height:auto;flex-direction:row;
    border-right:0;border-bottom:1px solid var(--line);padding:0;overflow-x:auto;gap:0}
  .rail-mark,.rail-sp,.rail-theme{display:none}
  .rail-btn{flex:1 0 auto;flex-direction:row;gap:6px;padding:11px 13px;border-left:0;border-bottom:2px solid transparent;
    white-space:nowrap}
  .rail-btn[aria-current="true"]{border-left-color:transparent;border-bottom-color:var(--accent)}
  .rail-btn .t{font-size:9.5px}
  .rail-badge{position:static;transform:none;margin-left:1px}
  .main{padding-block:0 72px}
  .top{margin-bottom:22px}
  .clock{top:calc(env(safe-area-inset-top,0px) + 46px)}
  .grades{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:430px){
  body{font-size:14.5px}
  .card-face{min-height:170px}
  .brand{font-size:14px}
  .ctr{font-size:10px;padding:2.5px 8px}
}

          "text": "For most of the twentieth century the tram was treated as an embarrassment. Between 1935 and 1965 almost every large city in North America, and a great many in Western Europe, tore up its tracks, and few observers mourned them. Trams were slow; they obstructed motor traffic; and they ran on fixed routes that could not follow the suburbs then spreading outwards from every centre. The diesel bus that replaced them was cheaper to buy, required no infrastructure beyond roads that already existed, and could be rerouted overnight in response to demand. At the time, the logic seemed unanswerable."

        "example": "What separates high-performing education systems from the rest is not the size of the budget but the quality of teacher training.",
        "zh": "假分裂句（What 子句），將句子重組以凸顯強調的部分，置於 is/are 之後（例：真正關鍵的是⋯⋯而非⋯⋯）",
        "errors": "What separates the systems is the quality of teacher training is the budget — two complements cannot follow is; choose one, or use not X but Y.\nWhat is separates the systems... — is appears only once, after the What-clause, never doubled inside it.\nWhat the systems is separated by is... — the clause after What must read as a normal statement, not an awkwardly split passive fragment.",

        "why": "This structure lets you delay your main claim to the end of the sentence, where an examiner's attention is naturally highest, and it reads as considered rather than assembled because English speakers use it constantly in spoken argument. Its most common failure is trying to emphasise two things inside one What-clause; keep the frame to a single complement, and use the not X but Y pattern from the example when you want to explicitly rule out a competing explanation. Overusing it — more than once or twice in an essay — starts to sound like a rhetorical tic rather than genuine emphasis, so save it for the sentence carrying your central claim."

    ]

/* ── SRS ladder ─────────────────────────────────────────────────────── */
const LADDER = [1, 3, 7, 16, 35, 90];
const GRADES = [
  {k:'Again', cls:'g0'}, {k:'Hard', cls:'g1'},
  {k:'Good',  cls:'g2'}, {k:'Easy', cls:'g3'}
];
const LAST = LADDER.length - 1;
const intervalFor = s => LADDER[Math.max(0, Math.min(s, LAST))];

/* Again → back to step 0 of the ladder. Hard → hold the current step.
   Good → one step up. Easy → two.
   A wrong Active Recall answer is harsher than any of these: it sets the
   interval to 0, which means today, not +1 day. */
function nextState(step, grade){
  if (grade === 0) return {step:0, days:LADDER[0]};
  if (grade === 1) return {step, days:intervalFor(step)};
  const ns = Math.min(step + (grade === 2 ? 1 : 2), LAST);
  return {step:ns, days:intervalFor(ns)};
}

/* ── dates (real calendar, never day numbers) ───────────────────────── */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayISO = () => iso(new Date());
function addDays(n){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+n); return iso(d); }
function prettyDate(s){
  if (!s) return '—';
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
function daysUntil(s){
  if (!s) return 0;
  const [y,m,d] = s.split('-').map(Number);
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((new Date(y, m-1, d) - t) / 86400000);
}

/* ── day counters ───────────────────────────────────────────────────── */
const dayKeys    = () => Object.keys(DAYS).map(Number).filter(n => !isNaN(n)).sort((a,b) => a-b);
const deckDay    = () => Math.max(...dayKeys().filter(n => Array.isArray(DAYS[n]?.cards)), 0);
const practiceDay= () => Math.max(...dayKeys().filter(n => DAYS[n]?.reading), 0);

/* Every card ever published, tagged with the day it arrived.
   Skipped days queue — they never vanish, because this reads DAYS, not a cursor. */
function publishedCards(){
  const out = [];
  for (const n of dayKeys()){
    if (!Array.isArray(DAYS[n]?.cards)) continue;
    for (const c of DAYS[n].cards) out.push({...c, day:n});
  }
  return out;
}

/* ── storage: db capability, with a local mirror so the page works alone ── */
const store = {
  db:null, ready:false, cache:new Map(),
  key: p => 'bl:' + p,
  local(p){ try { const v = localStorage.getItem(this.key(p)); return v ? JSON.parse(v) : null; } catch(e){ return null; } },
  saveLocal(p, v){ try { localStorage.setItem(this.key(p), JSON.stringify(v)); } catch(e){} },
  get(p){ if (this.cache.has(p)) return this.cache.get(p); const v = this.local(p); this.cache.set(p, v); return v; },
  async set(p, v){
    this.cache.set(p, v); this.saveLocal(p, v);
    if (this.db){ try { await this.db.doc(p).set(v); } catch(e){ /* keep the local copy */ } }
  },
  async boot(){
    try { this.db = await window.claude?.use?.('db') || null; } catch(e){ this.db = null; }
    if (this.db){
      try {
        const snap = await this.db.collection('cards').get();
        snap.docs.forEach(d => { this.cache.set('cards/' + d.id, d.data()); this.saveLocal('cards/' + d.id, d.data()); });
        for (const p of ['review/last']) {
          const s = await this.db.doc(p).get();
          if (s.exists){ this.cache.set(p, s.data()); this.saveLocal(p, s.data()); }
        }
        const pd = practiceDay();
        for (const p of [`writing/day-${pd}`, `drills/day-${pd}`, `answers/day-${pd}`]) {
          const s = await this.db.doc(p).get();
          if (s.exists){ this.cache.set(p, s.data()); this.saveLocal(p, s.data()); }
        }
      } catch(e){ /* fall back to the local mirror */ }
    }
    this.ready = true;
    render();
  }
};

/* A card graded Easy this many times retires to the learned pool and stops
   appearing in Study and Active recall. The pool itself lives on the progress
   page; the daily task copies retired cards across. */
const LEARN_AT = 5;

/* card SRS state — never trust a stale copy of the card body, always re-read DAYS */
function cardState(id){
  const s = store.get('cards/' + id);
  return s && typeof s.step === 'number' ? s : {step:0, due:todayISO(), seen:0, lapses:0, easy:0, learned:false};
}
function saveCard(card, st){
  return store.set('cards/' + card.id, {
    step:st.step, due:st.due, seen:st.seen, lapses:st.lapses,
    easy:st.easy || 0, learned:!!st.learned, learnedAt:st.learnedAt || null,
    /* the card body travels with the state so the progress page can show the
       learned pool without a copy of DAYS */
    day:card.day, kind:card.kind, item:card.item, pos:card.pos, ipa:card.ipa, zh:card.zh,
    updated:new Date().toISOString()
  });
}

/* Everything still in rotation. Study and Active recall read this; Recap and the
   distractor pool deliberately read publishedCards() instead. */
const activeCards  = () => publishedCards().filter(c => !cardState(c.id).learned);
const learnedCards = () => publishedCards().filter(c => cardState(c.id).learned);

const dueCards = () => activeCards()
  .filter(c => cardState(c.id).due <= todayISO())
  .sort((a,b) => (cardState(a.id).due).localeCompare(cardState(b.id).due) || a.day - b.day);

/* ══ audio ═══════════════════════════════════════════════════════════════
   Recorded with Piper (en-us-ryan-high) and published alongside the page —
   external audio is blocked by the artifact CSP, and speechSynthesis alone
   fails silently on iOS with the ringer off and inside in-app webviews.
   So: mp3 first, speechSynthesis only as a fallback, failures made visible.
   ════════════════════════════════════════════════════════════════════════ */
let ttsWoken = false, currentAudio = null;
function wakeTTS(){
  if (ttsWoken || !('speechSynthesis' in window)) return;
  ttsWoken = true;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch(e){}
}
document.addEventListener('pointerdown', wakeTTS, {once:true, capture:true});

function audioFail(btn, msg){
  if (!btn) return;
  btn.classList.remove('playing'); btn.classList.add('failed');
  const host = btn.closest('.audio-host') || btn.parentElement;
  let err = host?.querySelector('.audio-err');
  if (!err && host){ err = document.createElement('div'); err.className = 'audio-err'; host.appendChild(err); }
  if (err) err.textContent = msg;
}
function clearFail(btn){
  btn.classList.remove('failed');
  const host = btn.closest('.audio-host') || btn.parentElement;
  host?.querySelector('.audio-err')?.remove();
}

function speakFallback(text, btn){
  if (!('speechSynthesis' in window)){ audioFail(btn, 'This browser has no speech support. The recording could not be reached either.'); return; }
  wakeTTS();
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.95;
    let started = false;
    u.onstart = () => { started = true; btn?.classList.add('playing'); };
    u.onend   = () => btn?.classList.remove('playing');
    u.onerror = () => audioFail(btn, 'Your browser blocked the speech engine. On iPhone, check the silent switch on the side of the phone.');
    speechSynthesis.speak(u);   // deliberately no cancel() first — it kills the next utterance on iOS
    setTimeout(() => { if (!started) audioFail(btn, 'No sound came out. On iPhone, check the silent switch; in an in-app browser, open this in Safari or Chrome.'); }, 1400);
  } catch(e){ audioFail(btn, 'Audio is unavailable in this browser.'); }
}

function playClip(id, kind, text, btn){
  wakeTTS();
  if (btn) clearFail(btn);
  if (currentAudio){ try { currentAudio.pause(); } catch(e){} currentAudio = null; }
  document.querySelectorAll('.audio.playing').forEach(b => b.classList.remove('playing'));
  let fellBack = false;
  const fall = () => { if (fellBack) return; fellBack = true; speakFallback(text, btn); };
  try {
    const a = new Audio(`audio/${id}-${kind}.mp3`);
    currentAudio = a;
    a.addEventListener('playing', () => btn?.classList.add('playing'));
    a.addEventListener('ended',   () => btn?.classList.remove('playing'));
    a.addEventListener('error', fall);
    a.play().catch(fall);
  } catch(e){ fall(); }
}

const SPK = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3 4 5.8H2v4.4h2L7 13V3Z"/><path d="M10.4 6a3 3 0 0 1 0 4"/><path d="M12.4 4a5.6 5.6 0 0 1 0 8"/></svg>`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function audioBtn(id, kind, text, label){
  return `<span class="audio-host"><button class="audio" data-audio="${id}" data-kind="${kind}" data-text="${esc(text)}">${SPK}<span>${label}</span></button></span>`;
}

function cardBack(c){

/* ══ 02 ACTIVE RECALL ═══════════════════════════════════════════════ */
/* Questions are generated from the card data, so every appended day feeds
   this section with no extra authoring. Grammar cards are routed away from
   the typed and 中文 types — you cannot usefully type a whole pattern, and
   a pattern's gloss gives the answer away. */
const recall = {round:null, i:0, answered:null, correct:0, ROUND:8};

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();

function buildRound(){
  const pool = activeCards();
  const distractorPool = publishedCards();   // retired cards still make good decoys
  if (pool.length < 1 || distractorPool.length < 4) return null;
  const picked = shuffle(pool).slice(0, Math.min(recall.ROUND, pool.length));
  return picked.map(c => {
    const types = c.kind === 'grammar' ? ['def', 'gap'] : ['def', 'gap', 'zh', 'type'];
    const type = types[Math.floor(Math.random() * types.length)];
    // distractors always come from cards of the same kind
    const sameKind = distractorPool.filter(x => x.kind === c.kind && x.id !== c.id);
    const distractors = shuffle(sameKind).slice(0, 3).map(x => x.item);
    const options = shuffle([c.item, ...distractors]);
    return {card:c, type, options, answer:c.item};
  });
}

function gapSentence(c){
  const esc_ = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const head = c.item.split(/\s+/)[0];
  const re = new RegExp(esc_(c.item), 'i');
  if (re.test(c.example)) return c.example.replace(re, '<span class="blank"></span>');
  const re2 = new RegExp('\\b' + esc_(head) + '\\w*', 'i');
  if (re2.test(c.example)) return c.example.replace(re2, '<span class="blank"></span>');
  return c.example + ' <span class="blank"></span>';
}

function renderRecall(){
  const el = document.getElementById('s-recall');
  if (!recall.round){
    const pool = activeCards();
    el.innerHTML = `
      <div class="sec-head"><span class="sec-num">02</span><h2>Active recall</h2></div>
      <p class="sec-sub">Eight questions, generated fresh from your own cards. Definition→item, gap-fill, 中文→item,
        and type-it with no options. Get one wrong and that card's interval resets to zero and comes back today.</p>
      <div class="panel"><div class="empty">
        ${pool.length ? `<h3>${pool.length} cards in the pool.</h3>
        <p>A round is eight questions and takes about four minutes. Distractors are pulled from other cards of the
           same kind — retired ones included, since a card you know makes a convincing wrong answer.
           ${learnedCards().length ? `The ${learnedCards().length} learned cards are never asked about.` : ''}</p>
        <button class="btn btn-p" id="startRound" style="margin-top:18px">Start a round</button>`
        : `<h3>Every card is learned.</h3>
        <p>Nothing left to test. The ${publishedCards().length} retired cards are in the pool on the progress page,
           and tomorrow's deck day will bring nine more.</p>`}
      </div></div>`;
    const b = el.querySelector('#startRound');
    if (b) b.onclick = () => {
      recall.round = buildRound(); recall.i = 0; recall.correct = 0; recall.answered = null; renderRecall();
    };
    return;
  }

  if (recall.i >= recall.round.length){
    const pct = Math.round(recall.correct / recall.round.length * 100);
    el.innerHTML = `
      <div class="sec-head"><span class="sec-num">02</span><h2>Round complete</h2></div>
      <div class="panel" style="text-align:center;padding-block:38px">
        <div class="score-big" style="color:var(--${pct >= 75 ? 'good' : pct >= 50 ? 'warn' : 'bad'})">${recall.correct}<span style="color:var(--muted);font-size:24px">/${recall.round.length}</span></div>
        <p class="note" style="margin-top:10px;max-width:46ch;margin-inline:auto">
          ${pct >= 88 ? 'Clean round. The misses below are the only cards that moved.'
            : pct >= 63 ? 'Solid. Every card you missed is back in today’s Study queue — clear it before you close the app.'
            : 'Rough round, which is useful information. The missed cards are due again today; run Study first, then come back.'}
        </p>
        <button class="btn btn-p" id="againRound" style="margin-top:20px">Another round</button>
        <button class="btn" id="toDeck" style="margin-top:20px">Go to Study queue</button>
      </div>`;
    el.querySelector('#againRound').onclick = () => { recall.round = buildRound(); recall.i = 0; recall.correct = 0; recall.answered = null; renderRecall(); };
    el.querySelector('#toDeck').onclick = () => go('deck');
    return;
  }

  const q = recall.round[recall.i], c = q.card, a = recall.answered;
  const stem =
    q.type === 'def'  ? `Which item means: <em>${esc(c.def)}</em>` :
    q.type === 'gap'  ? gapSentence(c) :
    q.type === 'zh'   ? `Which item is: <em>${esc(c.zh)}</em>` :
                        `Type the item that means: <em>${esc(c.def)}</em><br><span style="font-size:14px;color:var(--muted)">${esc(c.zh)}</span>`;
  const label = {def:'Definition → item', gap:'Gap-fill', zh:'中文 → item', type:'Type it'}[q.type];

  el.innerHTML = `
    <div class="sec-head"><span class="sec-num">02</span><h2>Active recall</h2></div>
    <div class="bar"><i style="width:${recall.i / recall.round.length * 100}%"></i></div>
    <div class="panel">
      <div class="q-head">
        <span class="q-type">${label}</span>
        ${kindTag(c.kind)}<span class="tag">Day ${c.day}</span>
        <span class="prog">${recall.i + 1} / ${recall.round.length}</span>
      </div>
      <div class="q-stem">${stem}</div>
      ${q.type === 'type'
        ? `<div style="display:flex;gap:9px;flex-wrap:wrap"><input type="text" id="typed" placeholder="Type it exactly" autocomplete="off" autocapitalize="off" spellcheck="false" ${a ? 'disabled' : ''} style="flex:1;min-width:180px">
           <button class="btn btn-p" id="checkTyped" ${a ? 'disabled' : ''}>Check</button></div>`
        : `<div class="opts">${q.options.map((o, i) => {
            let cls = '';
            if (a){ if (o === q.answer) cls = 'right'; else if (o === a.given) cls = 'wrong'; }
            return `<button class="opt ${cls}" data-opt="${esc(o)}" ${a ? 'disabled' : ''}><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`;
          }).join('')}</div>`}
      ${a ? `<div class="verdict ${a.ok ? 'ok' : 'no'}">
          <div class="verdict-h">${a.ok ? 'Correct' : `Not quite — the answer is ${esc(q.answer)}`}</div>
          <div style="font-family:var(--fb);font-size:14px;line-height:1.6">${esc(c.example)}</div>
          ${a.ok ? '' : '<div class="note" style="margin-top:8px">This card’s interval has been reset to zero. It is due again today.</div>'}
          <div class="why-box"><div class="why-l">Why it earns you marks</div>${esc(c.why)}</div>
        </div>
        <div style="display:flex;gap:9px;margin-top:16px;flex-wrap:wrap">
          ${audioBtn(c.id, 's', c.example, 'Hear the example')}
          <button class="btn btn-p" id="nextQ" style="margin-left:auto">${recall.i + 1 === recall.round.length ? 'Finish round' : 'Next question'}</button>
        </div>` : ''}
    </div>`;

  const answer = async given => {
    const ok = q.type === 'type' ? norm(given) === norm(q.answer) : given === q.answer;
    recall.answered = {given, ok};
    if (ok) recall.correct++;
    else {
      const st = cardState(c.id);
      await saveCard(c, {...st, step:0, due:todayISO(), seen:(st.seen || 0) + 1, lapses:(st.lapses || 0) + 1});
      renderCounters();
    }
    renderRecall();
  };
  el.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => answer(b.dataset.opt));
  const ti = el.querySelector('#typed');
  if (ti && !a){
    ti.focus();
    el.querySelector('#checkTyped').onclick = () => answer(ti.value);
    ti.onkeydown = e => { if (e.key === 'Enter') answer(ti.value); };
  }
  const nq = el.querySelector('#nextQ');
  if (nq) nq.onclick = () => { recall.i++; recall.answered = null; renderRecall(); };
}

/* ══ 03 READING ═════════════════════════════════════════════════════ */
const reading = {started:false, elapsed:0, tick:null, answers:{}, submitted:false, result:null};

function clockText(sec, limit){
  const left = limit - sec, over = left < 0, v = Math.abs(left);
  return {txt:`${over ? '−' : ''}${String(Math.floor(v / 60)).padStart(2, '0')}:${String(v % 60).padStart(2, '0')}`, over};
}
function startClock(){
  if (reading.started || reading.submitted) return;
  reading.started = true;
  reading.tick = setInterval(() => { reading.elapsed++; paintClock(); }, 1000);
  paintClock();
}
function stopClock(){ clearInterval(reading.tick); reading.tick = null; }
function paintClock(){
  const R = DAYS[practiceDay()]?.reading; if (!R) return;
  const el = document.getElementById('clockT'); if (!el) return;
  const {txt, over} = clockText(reading.elapsed, R.minutes * 60);
  el.textContent = txt;
  el.classList.toggle('over', over);
  const box = document.getElementById('clockBox');
  box?.classList.toggle('idle', !reading.started);
  const lab = document.getElementById('clockL');
  if (lab) lab.textContent = !reading.started ? 'Starts on your first answer' : over ? 'Over time — keep going' : 'Time remaining';
}

function renderReading(){
  const el = document.getElementById('s-reading');
  const pd = practiceDay(), R = DAYS[pd]?.reading;
  if (!R){ el.innerHTML = `<div class="sec-head"><span class="sec-num">03</span><h2>Reading</h2></div><div class="panel"><div class="empty"><h3>No passage published yet.</h3></div></div>`; return; }

  const gapQs = R.questions.filter(q => q.gap);
  const usedOpts = gapQs.map(q => reading.answers['q' + q.n]).filter(Boolean);

  const passage = R.paras.map(p => {
    let t = esc(p.text);
    for (const gq of gapQs){
      const chosen = reading.answers['q' + gq.n];
      const opt = R.gapOptions.find(o => o.id === chosen);
      const shown = opt
        ? `<span class="gap filled">${esc(opt.text)}</span>`
        : `<span class="gap">GAP ${gq.gap.replace('GAP', '')} — Q${gq.n}</span>`;
      t = t.replace(`&lt;&lt;${gq.gap}&gt;&gt;`, shown);
    }
    return `<p><span class="pid">${p.id}</span>${t}</p>`;
  }).join('');

  const qHtml = R.questions.map(q => {
    const given = reading.answers['q' + q.n];
    const done = reading.submitted;
    const ok = done && (q.gap ? given === q.answer : given === q.answer);
    let body;
    if (q.gap){
      body = `<div class="gap-list">${R.gapOptions.map((o, i) => {
        let cls = given === o.id ? 'sel' : '';
        if (usedOpts.includes(o.id) && given !== o.id) cls += ' used';
        if (done){ cls = o.id === q.answer ? 'right' : (given === o.id ? 'wrong' : ''); }
        return `<button class="gap-opt ${cls}" data-rq="${q.n}" data-val="${o.id}" ${done ? 'disabled' : ''}>
          <span class="k">${i + 1}</span><span>${esc(o.text)}</span></button>`;
      }).join('')}</div>`;
    } else {
      body = `<div class="opts">${q.options.map((o, i) => {
        let cls = given === i ? 'sel' : '';
        if (done){ cls = i === q.answer ? 'right' : (given === i ? 'wrong' : ''); }
        return `<button class="opt ${cls}" data-rq="${q.n}" data-val="${i}" ${done ? 'disabled' : ''} ${given === i && !done ? 'style="border-color:var(--accent);background:var(--accent-soft)"' : ''}>
          <span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`;
      }).join('')}</div>`;
    }
    return `<div class="rq">
      <div class="q-head"><span class="rq-n">Q${q.n}</span><span class="rq-t">${esc(q.type)}</span>
        ${done ? `<span class="tag ${ok ? '' : 'due'}" style="${ok ? 'color:var(--good);border-color:var(--good);background:var(--good-soft)' : ''}">${ok ? 'correct' : 'missed'}</span>` : ''}</div>
      <div class="q-stem" style="font-size:15px">${q.q}</div>
      ${body}
      ${done ? `<div class="exp ${ok ? 'ok' : 'no'}"><div class="exp-h">${ok ? 'Why that is right' : 'Where it went wrong'}</div>${esc(q.why)}</div>` : ''}
    </div>`;
  }).join('');

  const res = reading.result;
  el.innerHTML = `
    <div class="sec-head"><span class="sec-num">03</span><h2>Reading</h2></div>
    <p class="sec-sub">One Academic passage, seven questions, ${R.minutes} minutes. The clock starts the moment you
      answer anything and does not stop when it runs out — overrun counts up in red, because knowing your real
      pace matters more than a clean number.</p>
    <div class="clock idle" id="clockBox">
      <span class="clock-t" id="clockT">${clockText(reading.elapsed, R.minutes * 60).txt}</span>
      <span class="clock-l" id="clockL">Starts on your first answer</span>
      <span class="prog" style="margin-left:auto">${Object.keys(reading.answers).length} / ${R.questions.length} answered</span>
    </div>
    ${res ? `<div class="banner"><div><b>Scored ${res.score}/${R.questions.length}</b> in ${Math.floor(res.seconds / 60)}:${String(res.seconds % 60).padStart(2, '0')}
      — that is ${res.pct}% at ${res.pace} per question. Both numbers are saved together; log them on the progress page.</div></div>` : ''}
    <div class="panel" style="margin-bottom:20px">
      <div class="q-head"><h3 style="font-size:17px">${esc(R.title)}</h3><span class="prog">${R.words} words</span></div>
      <div class="passage">${passage}</div>
    </div>
    <div class="panel">${qHtml}
      ${!reading.submitted ? `<div style="margin-top:22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-p" id="submitR">Submit all seven</button>
        <span class="note">${Object.keys(reading.answers).length < R.questions.length ? `${R.questions.length - Object.keys(reading.answers).length} still unanswered — submit anyway if you have run out of time.` : 'All answered.'}</span>
      </div>` : `<div style="margin-top:22px"><button class="btn" id="resetR">Reset and run it again</button></div>`}
    </div>`;

  el.querySelectorAll('[data-rq]').forEach(b => b.onclick = () => {
    startClock();
    const n = b.dataset.rq, v = b.dataset.val;
    const q = R.questions.find(x => x.n === +n);
    const val = q.gap ? v : +v;
    if (q.gap){
      // one option per gap: clear it from any other gap first
      for (const gq of gapQs) if (gq.n !== q.n && reading.answers['q' + gq.n] === val) delete reading.answers['q' + gq.n];
    }
    reading.answers['q' + n] = val;
    renderReading();
  });
  const sb = el.querySelector('#submitR');
  if (sb) sb.onclick = async () => {
    stopClock(); reading.submitted = true;
    const score = R.questions.filter(q => reading.answers['q' + q.n] === q.answer).length;
    const seconds = reading.elapsed;
    const pct = Math.round(score / R.questions.length * 100);
    const pace = `${Math.floor(seconds / R.questions.length / 60)}:${String(Math.round(seconds / R.questions.length) % 60).padStart(2, '0')}`;
    reading.result = {score, seconds, pct, pace};
    await store.set(`answers/day-${pd}`, {
      day:pd, passage:R.title, score, outOf:R.questions.length, pct, seconds,
      questions:R.questions.length, answers:reading.answers, at:new Date().toISOString()
    });
    renderReading();
  };
  const rb = el.querySelector('#resetR');
  if (rb) rb.onclick = () => {
    stopClock();
    Object.assign(reading, {started:false, elapsed:0, tick:null, answers:{}, submitted:false, result:null});
    renderReading();
  };
  paintClock();
}

/* ══ 04 WRITING ═════════════════════════════════════════════════════ */
const writing = {reveal:{}, timers:{}};
const wordCount = s => (String(s).trim().match(/\S+/g) || []).length;

function autosave(path, field, value, badge){
  clearTimeout(writing.timers[path + field]);
  if (badge){ badge.textContent = 'saving…'; badge.classList.remove('on'); }
  writing.timers[path + field] = setTimeout(async () => {
    const cur = store.get(path) || {};
    await store.set(path, {...cur, [field]:value, updated:new Date().toISOString()});
    if (badge){ badge.textContent = 'saved'; badge.classList.add('on'); }
  }, 700);
}

/* ══ 05 SPEAKING ════════════════════════════════════════════════════ */
const speak = {t:null, sec:0, running:null, phase:'talk'};

function stopSpeak(){ clearInterval(speak.t); speak.t = null; speak.running = null; speak.phase = 'talk'; renderSpeaking(); }
function runSpeak(part, withPrep){
  clearInterval(speak.t);
  speak.running = part; speak.sec = 0; speak.phase = withPrep ? 'prep' : 'talk';
  speak.t = setInterval(() => {
    speak.sec++;
    const S = DAYS[practiceDay()].speaking[part];
    if (speak.phase === 'prep' && speak.sec >= S.prepSeconds){ speak.phase = 'talk'; speak.sec = 0; }
    paintSpeak(part);
  }, 1000);
  paintSpeak(part);
}
function paintSpeak(part){
  const S = DAYS[practiceDay()].speaking[part];
  const limit = speak.phase === 'prep' ? S.prepSeconds : S.seconds;
  const el = document.getElementById('spT-' + part); if (!el) return;
  const {txt, over} = clockText(speak.sec, limit);
  el.textContent = txt;
  el.classList.toggle('over', over && speak.phase === 'talk');
  el.classList.toggle('prep', speak.phase === 'prep');
  const lab = document.getElementById('spL-' + part);
  if (lab) lab.textContent = speak.phase === 'prep' ? 'Preparing' : over ? 'Over — wrap it up' : 'Speaking';
}

function renderSpeaking(){
  const el = document.getElementById('s-speaking');
  const pd = practiceDay(), S = DAYS[pd]?.speaking;
  if (!S){ el.innerHTML = `<div class="sec-head"><span class="sec-num">05</span><h2>Speaking</h2></div><div class="panel"><div class="empty"><h3>No speaking set published yet.</h3></div></div>`; return; }

  const timer = (part, withPrep) => {
    const running = speak.running === part;
    return `<div class="timer-box">
      <span class="timer-t" id="spT-${part}">${clockText(running ? speak.sec : 0, withPrep && (!running || speak.phase === 'prep') ? S[part].prepSeconds : S[part].seconds).txt}</span>
      <span class="timer-l" id="spL-${part}">${running ? (speak.phase === 'prep' ? 'Preparing' : 'Speaking') : withPrep ? '1 min prep, then 2 min' : 'Rehearsal timer'}</span>
      <button class="btn ${running ? '' : 'btn-p'} btn-sm" data-sp="${part}" data-prep="${withPrep ? 1 : 0}" style="margin-left:auto">${running ? 'Stop' : 'Start'}</button>
    </div>`;
  };

  el.innerHTML = `
    <div class="sec-head"><span class="sec-num">05</span><h2>Speaking</h2></div>
    <p class="sec-sub">Record yourself on your phone and listen back — it is the only way to hear the stress errors
      the cards keep warning you about. Speaking is your weakest paper, so this section is never the one to skip.</p>

    <div class="sp-part panel">
      <div class="sp-h"><h3>${esc(S.part1.label)}</h3><span class="tag">${S.part1.seconds}s each</span></div>
      <p class="note">${esc(S.part1.note)}</p>
      <ul class="qlist">${S.part1.questions.map((q, i) => `<li><span class="qn">${i + 1}</span><span>${esc(q)}</span></li>`).join('')}</ul>
      ${timer('part1', false)}
    </div>

    <div class="sp-part panel">
      <div class="sp-h"><h3>${esc(S.part2.label)}</h3><span class="tag">1 min prep · 2 min talk</span></div>
      <p class="note" style="margin-bottom:14px">${esc(S.part2.note)}</p>
      <div class="cue">
        <div class="cue-t">${esc(S.part2.cue)}</div>
        <ul>${S.part2.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>
      </div>
      ${timer('part2', true)}
    </div>

    <div class="sp-part panel">
      <div class="sp-h"><h3>${esc(S.part3.label)}</h3><span class="tag">${S.part3.seconds}s each</span></div>
      <p class="note">${esc(S.part3.note)}</p>
      <ul class="qlist">${S.part3.questions.map((q, i) => `<li><span class="qn">${i + 1}</span><span>${esc(q)}</span></li>`).join('')}</ul>
      ${timer('part3', false)}
    </div>`;

  el.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => {
    const p = b.dataset.sp;
    if (speak.running === p) stopSpeak(); else runSpeak(p, b.dataset.prep === '1');
  });
}

    </div>

    <div class="panel">
      <h3 style="font-size:16px;margin-bottom:6px">How the two day counters work</h3>
      <p class="note" style="margin-bottom:12px">They are deliberately independent, and this is the thing to understand about the app.</p>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Counter</th><th>Now</th><th>Advances when</th></tr></thead>
        <tbody>
          <tr><td><b>Deck day</b></td><td class="mono">${deckDay()}</td><td>A scheduled task appends a new day of cards — daily, at 18:00 Taipei.</td></tr>
          <tr><td><b>Practice day</b></td><td class="mono">${practiceDay()}</td><td>A new passage and writing set are authored. Never automatically — an unfinished passage is never buried by new vocabulary.</td></tr>
        </tbody></table></div>
      <p class="note" style="margin-top:14px">So the deck can run ahead by weeks while you take your time over one reading passage. That is the intended behaviour, not drift.</p>
    </div>`;
}

/* ══ chrome ═════════════════════════════════════════════════════════ */
function renderCounters(){
  const box = document.getElementById('counters');
  const dd = deckDay(), pd = practiceDay(), due = dueCards().length, total = publishedCards().length;
  const parts = [];
  if (dd !== pd){
    parts.push(`<span class="ctr is-accent">Deck day <b>${dd}</b></span>`);
    parts.push(`<span class="ctr is-ochre">Practice day <b>${pd}</b></span>`);
  } else {
    parts.push(`<span class="ctr is-accent">Day <b>${dd}</b></span>`);
  }
  const learned = learnedCards().length;
  parts.push(`<span class="ctr">${due ? `<b>${due}</b> due` : 'nothing due'}</span>`);
  parts.push(`<span class="ctr">${total - learned} in rotation</span>`);
  if (learned) parts.push(`<span class="ctr is-learned"><b>${learned}</b> learned</span>`);
  box.innerHTML = parts.join('');
  const badge = document.getElementById('dueBadge');
  badge.hidden = !due; badge.textContent = due;
}

const SECTIONS = {deck:renderDeck, recall:renderRecall, reading:renderReading, writing:renderWriting, speaking:renderSpeaking, ref:renderRef};
let current = 'deck';
function go(name){
  current = name;
  for (const k of Object.keys(SECTIONS)) document.getElementById('s-' + k).hidden = (k !== name);
  document.querySelectorAll('.rail-btn').forEach(b => b.setAttribute('aria-current', String(b.dataset.go === name)));
  SECTIONS[name]();
  window.scrollTo({top:0, behavior:'instant'});
  try { localStorage.setItem('bl:section', name); } catch(e){}
}
document.querySelectorAll('.rail-btn').forEach(b => b.onclick = () => go(b.dataset.go));

/* delegated audio — survives every re-render */
document.addEventListener('click', e => {
  const b = e.target.closest('.audio');
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  playClip(b.dataset.audio, b.dataset.kind, b.dataset.text, b);
});

/* theme */
const SUN = `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3.1"/><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1M12.9 12.9l-1.1-1.1M4.2 4.2 3.1 3.1"/></svg>`;
const MOON = `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M13.5 9.6A5.9 5.9 0 0 1 6.4 2.5a5.9 5.9 0 1 0 7.1 7.1Z"/></svg>`;
function paintTheme(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark'
    || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme:dark)').matches);
  document.getElementById('themeBtn').innerHTML = dark ? SUN : MOON;
}
document.getElementById('themeBtn').onclick = () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark'
    || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  try { localStorage.setItem('bl:theme', dark ? 'light' : 'dark'); } catch(e){}
  paintTheme();
};
try { const t = localStorage.getItem('bl:theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch(e){}

function render(){ renderCounters(); SECTIONS[current](); }

paintTheme();
renderCounters();
let boot = 'deck';
try { boot = localStorage.getItem('bl:section') || 'deck'; } catch(e){}
go(SECTIONS[boot] ? boot : 'deck');
store.boot();
</script>
